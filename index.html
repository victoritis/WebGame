<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dungeon Crawler - Aventura Épica</title>
    <meta name="description" content="Dungeon Crawler: Juego de aventuras épico desarrollado con Phaser 3, TypeScript y Vite" />
    <meta name="keywords" content="dungeon crawler, roguelike, phaser, juego web, typescript" />
    <meta name="author" content="Tu Nombre" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #0b2e13 0%, #1a5c2e 100%);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      #app {
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        overflow: hidden;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 1000;
      }

      #loading h1 {
        font-size: 48px;
        color: #FFD700;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }

      #loading p {
        font-size: 20px;
        color: #cccccc;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 215, 0, 0.3);
        border-top-color: #FFD700;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 30px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        max-width: 90%;
      }

      .controls strong {
        color: #FFD700;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <h1>DUNGEON CRAWLER</h1>
      <div class="spinner"></div>
      <p>Cargando aventura...</p>
    </div>
    <div id="app"></div>
    <div class="controls">
      <strong>Controles:</strong> WASD/Flechas: Mover | ESPACIO: Atacar | SHIFT: Correr | I: Inventario | ESC: Pausa
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Ocultar pantalla de carga cuando el juego esté listo
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.transition = 'opacity 0.5s';
            loading.style.opacity = '0';
            setTimeout(() => loading.remove(), 500);
          }
        }, 2000);
      });
    </script>
  </body>
</html>
